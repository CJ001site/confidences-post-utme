        .calc-toggle { background: #ffc000; border: none; padding: 6px 12px; font-weight: bold; border-radius: 4px; cursor: pointer; }

        /* MAIN SYSTEM WORKSPACE */
        .workspace { flex: 1; display: flex; position: relative; overflow: hidden; }
        .main-content { flex: 1; display: flex; flex-direction: column; align-items: center; padding: 25px 15px; overflow-y: auto; }
        
        /* SUBJECT TABS */
        .subject-tabs { display: flex; gap: 5px; margin-bottom: 15px; width: 100%; max-width: 850px; }
        .tab-btn { flex: 1; padding: 10px; border: 1px solid #cbd5e1; background: #e2e8f0; font-weight: 600; cursor: pointer; border-radius: 4px; text-align: center; font-size: 0.9rem; }
        .tab-btn.active { background: white; border-bottom: 2px solid #002060; color: #002060; }

        .question-card { background: white; padding: 30px; border-radius: 6px; width: 100%; max-width: 850px; box-shadow: 0 1px 4px rgba(0,0,0,0.08); border-left: 4px solid #002060; margin-bottom: 20px; }

        .options-group { display: flex; flex-direction: column; gap: 10px; }

        .option-item:hover { background: #f4f6f9; }
        .option-item input { margin-right: 12px; transform: scale(1.15); }

        .action-buttons { display: flex; justify-content: space-between; width: 100%; max-width: 850px; margin-bottom: 15px; }
        .btn { padding: 10px 22px; border: 1px solid transparent; border-radius: 4px; font-weight: 600; cursor: pointer; }
        .btn-prev { background: #cbd5e1; color: #334155; }
        .btn-next { background: #002060; color: white; }
        .btn-submit { background: #d32f2f; color: white; }

        .calc-popup { position: absolute; top: 20px; right: 20px; background: #333; padding: 15px; border-radius: 6px; box-shadow: 0 4px 15px rgba(0,0,0,0.3); display: none; width: 220px; z-index: 500; }

        .calc-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 5px; }
        .calc-btn { padding: 10px; background: #555; color: white; border: none; font-weight: bold; border-radius: 3px; cursor: pointer; }
        .calc-btn.op { background: #ffc000; color: #222; }
        .calc-btn.clear { background: #d32f2f; }

        .bottom-nav { background: #ffffff; border-top: 1px solid #d2d6dc; padding: 12px 15px; display: flex; flex-wrap: wrap; justify-content: center; gap: 6px; width: 100%; }

</head>

        let selectedCourseKey = "";
        let currentCourse = [];
        let currentQuestionIndex = 0;
        let selectedAnswers = {}; 
        let countdownInterval;
        let timeRemaining = 30 * 60; 

        function startExamEngine() {
            const nameField = document.getElementById("candidateName").value.trim();
            selectedCourseKey = document.getElementById("courseSelect").value;

            if (!nameField || !selectedCourseKey) {
                alert("Please fill in your name and select your target course configuration to proceed.");
                return;
            }

            currentCourse = questionBank[selectedCourseKey];
            currentQuestionIndex = 0;
            selectedAnswers = {};
            
            document.getElementById("gatewayModal").style.display = "none";
            document.getElementById("portalSubHeader").innerText = `CBT SCREENING WORKSPACE: ${nameField.toUpperCase()}`;

            buildSubjectTabs(selectedCourseKey);
            renderNavigationDock();
            renderQuestion();
            startCountdownTimer();
        }

        function buildSubjectTabs(courseKey) {
            const tabsContainer = document.getElementById("subjectTabsContainer");
            tabsContainer.innerHTML = "";
            let uniqueSubjects = [];
            
            currentCourse.forEach(q => { if(!uniqueSubjects.includes(q.subject)) uniqueSubjects.push(q.subject); });

            uniqueSubjects.forEach((sub, i) => {
                const button = document.createElement("button");
                button.className = `tab-btn ${i === 0 ? 'active' : ''}`;
                button.innerText = sub;
                button.onclick = () => jumpToSubjectSection(sub);
                tabsContainer.appendChild(button);
            });
        }

        function jumpToSubjectSection(subjectName) {
            const targetIdx = currentCourse.findIndex(q => q.subject === subjectName);
            if (targetIdx !== -1) {
                currentQuestionIndex = targetIdx;
                renderQuestion();
                updateActiveTabState();
            }
        }

        function updateActiveTabState() {
            const currentSubject = currentCourse[currentQuestionIndex].subject;
            const tabs = document.querySelectorAll(".tab-btn");
            tabs.forEach(btn => {
                if(btn.innerText === currentSubject) btn.classList.add("active");
                else btn.classList.remove("active");
            });
        }

        function renderQuestion() {
            const currentQ = currentCourse[currentQuestionIndex];
            document.getElementById("questionMetaInfo").innerText = `${currentQ.subject.toUpperCase()} SECTION — YEAR ${currentQ.year} — QUESTION ${currentQuestionIndex + 1} OF ${currentCourse.length}`;
            document.getElementById("questionDisplayFrame").innerHTML = currentQ.question;

            const optionsGroup = document.getElementById("optionsDisplayFrame");
            optionsGroup.innerHTML = "";

            currentQ.options.forEach((opt, idx) => {
                const label = document.createElement("label");
                label.className = "option-item";

                const radio = document.createElement("input");
                radio.type = "radio";
                radio.name = "cbt-opt";
                radio.value = idx;
                if(selectedAnswers[currentQuestionIndex] === idx) radio.checked = true;

                radio.onchange = () => {
                    selectedAnswers[currentQuestionIndex] = idx;
                    updateNavigationDockStatus();
                };

                label.appendChild(radio);
                label.appendChild(document.createTextNode(opt));
                optionsGroup.appendChild(label);
            });

            updateActiveDockHighlight();
            updateActiveTabState();
        }

        function changeQuestion(direction) {
            const newIndex = currentQuestionIndex + direction;
            if (newIndex >= 0 && newIndex < currentCourse.length) {
                currentQuestionIndex = newIndex;
                renderQuestion();
            } else if (newIndex >= currentCourse.length) {
                if (confirm("You have reached the final question. Would you like to submit your exam screening records?")) {
                    submitExamToManager();
                }
            }
        }

        function renderNavigationDock() {
            const dock = document.getElementById("navigationDock");
            dock.innerHTML = "";
            currentCourse.forEach((_, idx) => {
                const btn = document.createElement("button");
                btn.className = "nav-btn";
                btn.innerText = idx + 1;
                btn.onclick = () => {
                    currentQuestionIndex = idx;
                    renderQuestion();
                };
                dock.appendChild(btn);
            });
        }

        function updateNavigationDockStatus() {
            const buttons = document.querySelectorAll(".nav-btn");
            Object.keys(selectedAnswers).forEach(key => {
                buttons[key].classList.add("answered");
            });
        }

        function updateActiveDockHighlight() {
            const buttons = document.querySelectorAll(".nav-btn");
            buttons.forEach((btn, idx) => {
                if(idx === currentQuestionIndex) btn.classList.add("active");
                else btn.classList.remove("active");
            });
        }

        function startCountdownTimer() {
            clearInterval(countdownInterval);
            countdownInterval = setInterval(() => {
                timeRemaining--;
                let mins = Math.floor(timeRemaining / 60);
                let secs = timeRemaining % 60;
                document.getElementById("timer").innerText = `${mins.toString().padStart(2, '0')}:${secs.toString().padStart(2, '0')}`;

                if (timeRemaining <= 0) {
                    clearInterval(countdownInterval);
                    alert("Time expired! Your exam script will submit automatically.");
                    submitExamToManager();
                }
            }, 1000);
        }

        function toggleCalculator() {
            const calc = document.getElementById("calcPopup");
            calc.style.display = calc.style.display === "block" ? "none" : "block";
        }
        function inputCalc(val) { document.getElementById("calcDisplay").value += val; }
        function clearCalc() { document.getElementById("calcDisplay").value = ""; }
        function solveCalc() {
            try { document.getElementById("calcDisplay").value = eval(document.getElementById("calcDisplay").value); }
            catch { document.getElementById("calcDisplay").value = "Error"; }
        }

        // GOOGLE SHEET SYNC SYSTEM SUBMISSION LOGIC WITH YOUR LIVE MACRO URL CONNECTED
        function submitExamToManager() {
            clearInterval(countdownInterval);
            
            // Calculate scores per subject dynamically
            let breakdown = {};
            currentCourse.forEach((q, idx) => {
                if (!breakdown[q.subject]) breakdown[q.subject] = { total: 0, correct: 0 };
                breakdown[q.subject].total++;
                if (selectedAnswers[idx] === q.correct) breakdown[q.subject].correct++;
            });

            // Format scores out of 100% per subject structure
            let scoresData = {};
            Object.keys(breakdown).forEach(sub => {
                scoresData[sub] = Math.round((breakdown[sub].correct / breakdown[sub].total) * 100);
            });

            const candidateName = document.getElementById("candidateName").value.trim();
            const courseSelect = document.getElementById("courseSelect");
            const courseText = courseSelect.options[courseSelect.selectedIndex].text;

            const payload = {
                name: candidateName,
                course: courseText,
                english: scoresData["English"] || 0,
                math: scoresData["Mathematics"] || 0,
                physics: scoresData["Physics"] || 0,
                chemistry: scoresData["Chemistry"] || 0,
                literature: scoresData["Literature"] || 0,
                government: scoresData["Government"] || 0,
                crs: scoresData["CRS"] || 0,
                agriculture: scoresData["Agriculture"] || 0,
                biology: scoresData["Biology"] || 0
            };

            // YOUR LIVE WEB APP MACRO URL EMBEDDED SAFELY BELOW:
            const targetSheetUrl = "https://script.google.com/macros/s/AKfycbzuHf-mZCDvsH2s4Jb0yPpNekq4f16CAC9mkQvOaQAprnbYThFiNfepKJj0hPGCgHOO/exec";

            alert("Submitting results to screening system database. Please wait...");

            fetch(targetSheetUrl, {
                method: "POST",
                mode: "no-cors",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify(payload)
            })
            .then(() => {
                alert(`Screening complete, ${candidateName}! Your scores have been logged successfully into the administrative Google Sheet.`);
                location.reload();
            })
            .catch(err => {
                console.error(err);
                alert("Network communication error. Unable to synchronize sheet rows data.");
            });
        }
